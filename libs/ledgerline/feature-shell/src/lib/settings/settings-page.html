@let all = settings();

<div class="page">
  @if (notice()) {
    <p class="notice" role="status">{{ notice() }}</p>
  }

  <ui-panel heading="Analyzers">
    @if (loading() && !all) {
      <p class="empty">Loading settings…</p>
    } @else if (failure()) {
      <p class="empty empty--bad">Settings did not load: {{ $any(failure()).message }}</p>
    } @else if (all) {
      <ll-analyzer-settings [settings]="all" [busy]="busy()" (changed)="onChanged($event)" />
    }
  </ui-panel>

  <!-- §6.8's LLM provider and Redaction. Above Data because it is the section with a
       decision in it, and a decision belongs before housekeeping — and because the
       degraded-call log below only means anything once a provider is chosen. -->
  <ui-panel heading="AI assistance">
    @if (all) {
      <ll-llm-settings
        [settings]="llm()"
        [busy]="busy()"
        [health]="health()"
        [probing]="probing()"
        (changed)="onLlmChanged($event)"
        (tested)="onTestConnection()"
      />
    }
  </ui-panel>

  <!-- §6.8's Merchant aliases, reduced by §9s to the one thing on it that is
       configuration rather than data: the sweep. Above Data because it is an action
       on the ledger, and Data is where the ledger is backed up and thrown away. -->
  <ui-panel heading="Merchant names">
    <ll-renormalize-settings
      [busy]="busy()"
      [transactionCount]="transactionCount()"
      [running]="sweep()"
      (renormalize)="onRenormalizeAll()"
    />
  </ui-panel>

  <!-- §6.8's Categories. Above Data for the reason AI assistance is: it holds a
       decision — §5.4's overlap groups — and Data is housekeeping. -->
  <ui-panel heading="Categories">
    <ll-category-settings
      [usage]="categories()"
      [busy]="busy()"
      (acted)="onCategoryAction($event)"
    />
  </ui-panel>

  <ui-panel heading="Data">
    @if (all) {
      <ll-data-settings
        [settings]="all"
        [busy]="busy()"
        [lastBackupPath]="lastBackupPath()"
        [degradedCalls]="degradedCalls()"
        (acted)="onDataAction($event)"
      />
    }
  </ui-panel>
</div>
