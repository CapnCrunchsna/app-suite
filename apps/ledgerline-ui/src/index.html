<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ledgerline</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Both generated by `node tools/make-app-icon.mjs ledgerline-ui`; never edited
         by hand. The SVG is what every current browser takes, and stays crisp at
         any size; the .ico is the fallback and what Windows uses for a pinned
         shortcut. Declaration order matters — the SVG must come first, or Chrome
         takes the .ico and never looks further. -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
