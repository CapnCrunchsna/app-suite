<header class="header">
  <span class="header__brand">Ledgerline</span>
  <span class="header__tagline">local statement analyzer</span>
  <span class="header__spacer"></span>
  <span class="header__provider" [class.header__provider--remote]="llmProvider() === 'claude-cli'">
    LLM: {{ llmProvider() }}
  </span>
</header>

<div class="shell">
  <nav class="rail" aria-label="Sections">
    @for (section of sections; track section.label) { @if (section.path) {
    <a
      class="rail__item"
      [routerLink]="section.path"
      routerLinkActive="rail__item--active"
      #active="routerLinkActive"
      [attr.aria-current]="active.isActive ? 'page' : null"
    >
      {{ section.label }}
    </a>
    } @else {
    <span
      class="rail__item rail__item--pending"
      title="Not built yet — see spec section 6."
      aria-disabled="true"
    >
      {{ section.label }}
    </span>
    } }
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
