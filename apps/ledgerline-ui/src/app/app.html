<header class="header">
  <span class="header__brand">Ledgerline</span>
  <span class="header__tagline">local statement analyzer</span>
  <span class="header__spacer"></span>
  <span class="header__provider" [class.header__provider--remote]="llmProvider() === 'claude-cli'">
    LLM: {{ llmProvider() }}
  </span>
</header>

<div class="shell">
  <nav class="rail" aria-label="Sections">
    @for (section of sections; track section.label) { @if (section.path) { @let badged =
    section.badge && reviewCount() > 0;
    <a
      class="rail__item"
      [routerLink]="section.path"
      routerLinkActive="rail__item--active"
      #active="routerLinkActive"
      [attr.aria-current]="active.isActive ? 'page' : null"
      [attr.aria-label]="
        badged ? section.label + ', ' + reviewCount() + ' waiting for an answer' : null
      "
    >
      <span class="rail__label">{{ section.label }}</span>
      @if (badged) {
      <!-- Decorative: the count is already in the link's own accessible name above,
           and a bare number read out on its own says nothing. -->
      <span class="rail__badge" aria-hidden="true" title="Waiting for an answer">
        {{ reviewCount() }}
      </span>
      }
    </a>
    } @else {
    <span
      class="rail__item rail__item--pending"
      title="Not built yet — see spec section 6."
      aria-disabled="true"
    >
      <span class="rail__label">{{ section.label }}</span>
    </span>
    } }
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
